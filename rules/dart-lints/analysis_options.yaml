# Central Harness Dart/Flutter Analysis Options (SSOT)
# Do NOT edit this file inside individual projects. Run `harness sync` from central harness.

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error
    dead_code: error
    unused_import: error
    invalid_assignment: error
    ignore_for_file: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_empty_else
    - avoid_print
    - avoid_relative_lib_imports
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_const_constructors
    - prefer_final_fields
    - prefer_final_locals
    - unawaited_futures
    - use_key_in_widget_constructors
