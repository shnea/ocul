<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ocul Central Harness — Core Dashboard</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-dot"></span>
          <div>
            <div class="brand-title">OCUL HARNESS</div>
            <div class="brand-sub">Core Dashboard (127.0.0.1)</div>
          </div>
        </div>
        <nav class="nav" id="nav">
          <button class="nav-item active" data-tab="dashboard">대시보드</button>
          <button class="nav-item" data-tab="projects">프로젝트</button>
          <button class="nav-item" data-tab="rules">가드레일 / 템플릿</button>
          <button class="nav-item" data-tab="skills">스킬</button>
          <button class="nav-item" data-tab="mcp">MCP / 플러그인</button>
          <button class="nav-item" data-tab="logs">검증 로그</button>
          <button class="nav-item" data-tab="secrets">키 연결 (Secrets)</button>
        </nav>
        <div class="sidebar-footer">
          <span class="badge badge-muted">No-DB File SSOT</span>
          <span class="badge badge-warn">Vault: ~/.harness</span>
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <h1 id="page-title">대시보드</h1>
          <div class="topbar-actions">
            <button id="sync-all-btn" class="btn btn-secondary">Sync All</button>
            <button id="refresh-btn" class="btn">새로고침</button>
          </div>
        </header>
        <section id="content" class="content"></section>
      </main>
    </div>
    <div id="modal-root" class="modal-backdrop hidden">
      <div class="modal-box">
        <div class="modal-header">
          <strong id="modal-title"></strong>
          <button id="modal-close" class="btn btn-secondary btn-sm">닫기</button>
        </div>
        <pre id="modal-body" class="modal-pre"></pre>
      </div>
    </div>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
